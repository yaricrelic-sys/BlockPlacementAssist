
name: Build BlockPlacementAssist

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source project
        run: |
          mkdir -p source
          unzip -q BlockPlacementAssist-source.zip -d source

      - name: Build mod
        shell: bash
        run: |
          BUILD_FILE="$(find source -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found in source archive"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockPlacementAssist-Forge-1.20.1
          path: source/**/build/libs/*.jar
          if-no-files-found: error

